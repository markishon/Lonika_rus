<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ЛОНИКА</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;padding:0;height:100%;background:#0b1020;color:#e8eefc;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;align-items:center;height:100vh;height:100dvh;padding:8px;gap:8px}
  header{display:flex;justify-content:space-between;width:100%;max-width:560px;padding:0 6px}
  .stat{display:flex;flex-direction:column;font-size:11px;letter-spacing:2px;color:#8fa3c8}
  .stat b{font-size:22px;font-weight:800;color:#fff;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:1.1}
  #dirs{font-size:15px;letter-spacing:5px;color:#3d4a68;margin-top:3px;line-height:1;font-weight:700}
  #dirs span.on{color:#7cc0ff}
  #stage{position:relative}
  canvas{display:block;border-radius:16px;background:linear-gradient(160deg,#141a33,#0d1226);
    box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.05)}
  #previews{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:#8fa3c8}
  #previews .pv{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#2b3560,#1b2244);color:#fff;font-weight:800;font-size:16px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  #controls{display:flex;justify-content:space-between;width:100%;max-width:560px;padding:0 6px;gap:12px}
  .grp{display:flex;gap:12px}
  .key{width:64px;height:64px;border-radius:14px;border:1px solid #cfd8e8;background:linear-gradient(#f7f9ff,#dbe3f4);
    color:#1a2440;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 #9aa8c6,0 6px 14px rgba(0,0,0,.35);cursor:pointer;transition:transform .05s,box-shadow .05s}
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 #9aa8c6,0 3px 8px rgba(0,0,0,.35)}
  .key.go{background:linear-gradient(#ffd66b,#f0a83a);color:#3a2400;font-size:18px;letter-spacing:1px;
    border-color:#e0a83a;box-shadow:0 4px 0 #a06f18,0 6px 14px rgba(0,0,0,.35)}
  .key.go:active{box-shadow:0 1px 0 #a06f18,0 3px 8px rgba(0,0,0,.35)}
  @media (max-width:480px){.key{width:60px;height:60px}}
  #overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,12,26,.82);border-radius:16px;text-align:center;padding:24px;gap:14px;backdrop-filter:blur(6px);
    cursor:pointer}
  #overlay.on{display:flex}
  #overlay h1{margin:0;font-size:34px;letter-spacing:6px;background:linear-gradient(90deg,#7cc0ff,#c88bff,#ffb86b);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #overlay p{margin:0;color:#a8b6d4;font-size:14px;max-width:320px;line-height:1.5}
  #overlay button{margin-top:6px;padding:12px 24px;border-radius:12px;border:0;cursor:pointer;font-weight:800;
    font-size:16px;letter-spacing:1px;background:linear-gradient(#ffd66b,#f0a83a);color:#3a2400;
    box-shadow:0 4px 0 #a06f18}
  #overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #a06f18}
  #toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);padding:8px 16px;border-radius:10px;
    background:rgba(0,0,0,.7);color:#ffd66b;font-weight:700;letter-spacing:2px;font-size:13px;opacity:0;
    transition:opacity .2s;pointer-events:none}
  #toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat">СЧЁТ<b id="score">0</b></div>
    <div class="stat" style="align-items:flex-end">УРОВЕНЬ<b id="level">1</b>
      <div id="dirs"></div>
    </div>
  </header>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay"></div>
    <div id="toast"></div>
  </div>
  <div id="previews"><span>ДАЛЕЕ</span><div class="pv" id="pv0">·</div><div class="pv" id="pv1">·</div></div>
  <div id="controls">
    <div class="grp">
      <button class="key" data-act="left">←</button>
      <button class="key" data-act="right">→</button>
    </div>
    <div class="grp">
      <button class="key" data-act="down">↓</button>
      <button class="key go" data-act="go">GO</button>
    </div>
  </div>
</div>

<script src="dictionary.js"></script>
<script src="game.js"></script>
</body>
</html>
