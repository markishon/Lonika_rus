<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ЛОНИКА</title>
<style>
  :root{
    --text:#ffffff;
    --text-dim:#b8c2dc;
    --text-muted:#7a86a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{
    margin:0;padding:0;height:100%;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;background-color:#0a0620;
  }
  /* Упрощённый фон — без 20 слоёв */
  body::before{
    content:'';position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(ellipse 80% 60% at 25% 15%, rgba(110,70,200,.45) 0%, transparent 65%),
      radial-gradient(ellipse 80% 60% at 75% 85%, rgba(230,90,160,.35) 0%, transparent 65%),
      linear-gradient(180deg, #1a0f38 0%, #0a0620 100%);
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 15%, #fff 100%, transparent),
      radial-gradient(1px 1px at 35% 8%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 60% 22%, #fff 100%, transparent),
      radial-gradient(1px 1px at 82% 12%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 20% 45%, #fff 100%, transparent),
      radial-gradient(1px 1px at 70% 55%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 45% 75%, #fff 100%, transparent),
      radial-gradient(1px 1px at 88% 82%, #fff 100%, transparent);
    opacity:.7;
  }
  #app{
    display:flex;flex-direction:column;align-items:center;
    height:100vh;height:100dvh;padding:10px;gap:8px;
    position:relative;z-index:1;
    justify-content:space-between;
  }
  header{display:flex;justify-content:space-between;width:100%;max-width:480px;padding:0 8px}
  .stat{
    display:flex;flex-direction:column;
    font-size:12px;letter-spacing:3px;
    color:var(--text-muted);
    text-transform:uppercase;font-weight:700;
  }
  .stat b{
    display:block;margin-top:2px;
    font-size:28px;font-weight:900;letter-spacing:0;
    color:var(--text);
    font-variant-numeric:tabular-nums;
    line-height:1.1;
  }
  .stat.right{align-items:flex-end}
  #planet{
    font-size:11px;letter-spacing:2px;
    color:#a8b6d4;margin-top:3px;
    font-weight:800;text-transform:uppercase;
  }
  #dirs{
    font-size:13px;letter-spacing:4px;
    color:#2a3354;margin-top:3px;
    line-height:1;font-weight:700;
  }
  #dirs span.on{color:#7cc0ff}
  #middle{
    flex:1 1 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;width:100%;min-height:0;
  }
  #stage{position:relative}
  canvas{
    display:block;border-radius:18px;
    background:rgba(15,20,40,.85);
    border:1px solid rgba(100,120,200,.18);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #previews{
    display:flex;align-items:center;gap:10px;
    font-size:11px;letter-spacing:3px;
    color:var(--text-muted);text-transform:uppercase;font-weight:700;
  }
  #previews .pv{
    width:42px;height:42px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;
    background:linear-gradient(to bottom,#ffffff,#dce4f0);
    color:#1e2a4a;
    box-shadow:0 3px 0 #9aa5bf,0 6px 12px rgba(0,0,0,.4);
  }
  #controls{
    display:flex;justify-content:space-between;
    width:100%;max-width:480px;padding:0 8px;gap:12px;
    flex:0 0 auto;
  }
  .grp{display:flex;gap:12px}
  .key{
    width:68px;height:68px;border-radius:16px;
    border:1px solid #c8d0e2;
    background:linear-gradient(to bottom,#f7f9ff,#dbe3f4);
    color:#1e2a4a;font-size:28px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 0 #8a94b0,0 8px 20px rgba(0,0,0,.4);
    transition:transform .06s ease, box-shadow .06s ease;
    -webkit-appearance:none;appearance:none;padding:0;font-family:inherit;
    outline:none;
  }
  .key:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #8a94b0,0 4px 10px rgba(0,0,0,.4);
  }
  .key:focus{outline:none}
  .key.go{
    background:linear-gradient(to bottom,#ffd66b,#f0a83a);
    border-color:#e0a83a;color:#3a2400;
    font-size:20px;letter-spacing:1px;
    box-shadow:0 4px 0 #a06f18,0 8px 20px rgba(0,0,0,.4);
  }
  .key.go:active{box-shadow:0 1px 0 #a06f18,0 4px 10px rgba(0,0,0,.4)}
  @media (max-width:480px){
    .key{width:62px;height:62px;font-size:24px}
    .key.go{font-size:18px}
  }
  #overlay{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(8,6,24,.94);border-radius:18px;
    text-align:center;padding:22px;gap:12px;
    z-index:10;overflow-y:auto;
  }
  #overlay.on{display:flex}
  #overlay h1{
    margin:0;font-size:40px;letter-spacing:8px;font-weight:900;
    background:linear-gradient(90deg,#7cc0ff 0%,#c88bff 50%,#ff9ec0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #overlay p{
    margin:0;color:var(--text-dim);font-size:14px;
    max-width:340px;line-height:1.55;
  }
  #overlay button{
    margin-top:8px;padding:16px 44px;border-radius:999px;
    border:0;cursor:pointer;font-weight:900;font-size:18px;letter-spacing:1.5px;
    background:linear-gradient(to bottom,#ffd66b,#f0a83a);
    color:#3a2400;
    box-shadow:0 5px 0 #a06f18,0 10px 24px rgba(0,0,0,.4);
    transition:transform .06s ease, box-shadow .06s ease;
    font-family:inherit;
  }
  #overlay button:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #a06f18,0 5px 12px rgba(0,0,0,.4);
  }
  #toast{
    position:absolute;left:50%;top:14%;transform:translateX(-50%);
    padding:10px 22px;border-radius:999px;
    background:rgba(0,0,0,.85);
    border:1px solid rgba(255,214,107,.35);
    color:#ffd66b;
    font-weight:800;letter-spacing:2px;font-size:15px;
    opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
  }
  #toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat">Счёт<b id="score">0</b></div>
    <div class="stat right">
      Уровень<b id="level">1</b>
      <div id="planet">Меркурий</div>
      <div id="dirs"></div>
    </div>
  </header>
  <div id="middle">
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="overlay"></div>
      <div id="toast"></div>
    </div>
    <div id="previews"><span>Далее</span><div class="pv" id="pv0">·</div><div class="pv" id="pv1">·</div></div>
  </div>
  <div id="controls">
    <div class="grp">
      <button type="button" class="key" data-act="left">←</button>
      <button type="button" class="key" data-act="right">→</button>
    </div>
    <div class="grp">
      <button type="button" class="key" data-act="down">↓</button>
      <button type="button" class="key go" data-act="go">GO</button>
    </div>
  </div>
</div>
<script src="dictionary.js"></script>
<script src="game.js"></script>
</body>
</html>
