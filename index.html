<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ЛОНИКА</title>
<style>
  :root{
    --text:#ffffff;
    --text-dim:#b8c2dc;
    --text-muted:#7a86a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{
    margin:0;padding:0;height:100%;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;background-color:#0a0620;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(ellipse 80% 60% at 25% 15%, rgba(110,70,200,.45) 0%, transparent 65%),
      radial-gradient(ellipse 80% 60% at 75% 85%, rgba(230,90,160,.35) 0%, transparent 65%),
      linear-gradient(180deg, #1a0f38 0%, #0a0620 100%);
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 15%, #fff 100%, transparent),
      radial-gradient(1px 1px at 35% 8%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 60% 22%, #fff 100%, transparent),
      radial-gradient(1px 1px at 82% 12%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 20% 45%, #fff 100%, transparent),
      radial-gradient(1px 1px at 70% 55%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 45% 75%, #fff 100%, transparent),
      radial-gradient(1px 1px at 88% 82%, #fff 100%, transparent);
    opacity:.7;
  }
  #app{
    display:flex;flex-direction:column;align-items:center;
    height:100vh;height:100dvh;padding:10px;gap:8px;
    position:relative;z-index:1;
    justify-content:space-between;
  }
  header{display:flex;justify-content:space-between;width:100%;max-width:480px;padding:0 8px}
  .stat{
    display:flex;flex-direction:column;
    font-size:12px;letter-spacing:3px;
    color:var(--text-muted);
    text-transform:uppercase;font-weight:700;
  }
  .stat b{
    display:block;margin-top:2px;
    font-size:28px;font-weight:900;letter-spacing:0;
    color:var(--text);
    font-variant-numeric:tabular-nums;
    line-height:1.1;
  }
  .stat.right{align-items:flex-end}
  #planet{
    font-size:11px;letter-spacing:2px;
    color:#a8b6d4;margin-top:3px;
    font-weight:800;text-transform:uppercase;
  }
  #dirs{
    font-size:13px;letter-spacing:4px;
    color:#2a3354;margin-top:3px;
    line-height:1;font-weight:700;
  }
  #dirs span.on{color:#7cc0ff}
  #middle{
    flex:1 1 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;width:100%;min-height:0;
  }
  #stage{position:relative}
  canvas{
    display:block;
    /* border-radius ставится через JS ровно по скруглению угловой плитки */
    background:rgba(15,20,40,.85);
    border:1px solid rgba(100,120,200,.18);
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #previews{
    display:flex;align-items:center;gap:10px;
    font-size:11px;letter-spacing:3px;
    color:var(--text-muted);text-transform:uppercase;font-weight:700;
  }
  #previews .pv{
    width:42px;height:42px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;
    background:linear-gradient(to bottom,#ffffff,#dce4f0);
    color:#1e2a4a;
    box-shadow:0 3px 0 #9aa5bf,0 6px 12px rgba(0,0,0,.4);
  }
  #controls{
    display:flex;justify-content:space-between;
    width:100%;max-width:480px;padding:0 8px;gap:12px;
    flex:0 0 auto;
  }
  .grp{display:flex;gap:12px}
  .key{
    width:68px;height:68px;border-radius:16px;
    border:1px solid #c8d0e2;
    background:linear-gradient(to bottom,#f7f9ff,#dbe3f4);
    color:#1e2a4a;font-size:28px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 0 #8a94b0,0 8px 20px rgba(0,0,0,.4);
    transition:transform .06s ease, box-shadow .06s ease;
    -webkit-appearance:none;appearance:none;padding:0;font-family:inherit;
    outline:none;
  }
  .key:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #8a94b0,0 4px 10px rgba(0,0,0,.4);
  }
  .key:focus{outline:none}
  .key.go{
    background:linear-gradient(to bottom,#ffd66b,#f0a83a);
    border-color:#e0a83a;color:#3a2400;
    font-size:20px;letter-spacing:1px;
    box-shadow:0 4px 0 #a06f18,0 8px 20px rgba(0,0,0,.4);
  }
  .key.go:active{box-shadow:0 1px 0 #a06f18,0 4px 10px rgba(0,0,0,.4)}
  @media (max-width:480px){
    .key{width:62px;height:62px;font-size:24px}
    .key.go{font-size:18px}
  }

  body.in-menu header,
  body.in-menu #previews,
  body.in-menu #controls{
    display:none !important;
  }

  /* Скрывает всё, пока игра не инициализирована */
  body.loading #app,
  body.loading #tutorial{
    visibility:hidden;
  }

  #overlay{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(8,6,24,.94);
    /* border-radius ставится через JS синхронно с canvas */
    text-align:center;padding:22px;gap:12px;
    z-index:10;overflow-y:auto;
  }
  #overlay.on{display:flex}
  #overlay h1{
    margin:0;font-size:40px;letter-spacing:8px;font-weight:900;
    background:linear-gradient(90deg,#7cc0ff 0%,#c88bff 50%,#ff9ec0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #overlay p{
    margin:0;color:var(--text-dim);font-size:14px;
    max-width:340px;line-height:1.55;
  }
  #overlay button{
    margin-top:8px;padding:16px 44px;border-radius:999px;
    border:0;cursor:pointer;font-weight:900;font-size:18px;letter-spacing:1.5px;
    background:linear-gradient(to bottom,#ffd66b,#f0a83a);
    color:#3a2400;
    box-shadow:0 5px 0 #a06f18,0 10px 24px rgba(0,0,0,.4);
    transition:transform .06s ease, box-shadow .06s ease;
    font-family:inherit;
  }
  #overlay button:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #a06f18,0 5px 12px rgba(0,0,0,.4);
  }
  #toast{
    position:absolute;left:50%;top:14%;transform:translateX(-50%);
    padding:10px 22px;border-radius:999px;
    background:rgba(0,0,0,.85);
    border:1px solid rgba(255,214,107,.35);
    color:#ffd66b;
    font-weight:800;letter-spacing:2px;font-size:15px;
    opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
  }
  #toast.on{opacity:1}

  /* ============ ТИТУЛЬНЫЙ ЭКРАН ============ */
  .title-screen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;height:100%;
    gap:60px;
  }
  .title-logo-wrap{
    position:relative;
    width:280px;height:280px;
    display:flex;align-items:center;justify-content:center;
  }
  .title-logo-glow{
    position:absolute;inset:0;
    background:radial-gradient(circle,
      rgba(180,120,255,.45) 0%,
      rgba(120,80,220,.22) 40%,
      rgba(60,30,140,.08) 65%,
      transparent 80%);
    filter:blur(14px);
    animation:titleGlow 4s ease-in-out infinite;
    pointer-events:none;
  }
  .title-orbit{
    position:absolute;top:50%;left:50%;
    width:250px;height:250px;
    margin:-125px 0 0 -125px;
    border:1px dashed rgba(180,140,255,.3);
    border-radius:50%;
    animation:titleOrbit 22s linear infinite;
    pointer-events:none;
  }
  .title-orbit-inner{
    position:absolute;top:50%;left:50%;
    width:180px;height:180px;
    margin:-90px 0 0 -90px;
    border:1px dashed rgba(120,180,255,.22);
    border-radius:50%;
    animation:titleOrbitReverse 15s linear infinite;
    pointer-events:none;
  }
  .title-orbit::after{
    content:'';position:absolute;
    top:-6px;left:50%;margin-left:-6px;
    width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #ffd66b 0%, #f0a83a 55%, #8a4a20 100%);
    box-shadow:0 0 16px rgba(255,180,80,.9);
  }
  .title-orbit-inner::after{
    content:'';position:absolute;
    top:-5px;left:50%;margin-left:-5px;
    width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #c8a0ff 0%, #7c2ecc 55%, #3a0e6a 100%);
    box-shadow:0 0 14px rgba(180,120,255,.9);
  }
  .title-logo{
    position:relative;z-index:2;
    margin:0;
    font-size:58px;
    letter-spacing:12px;
    padding-left:12px;
    font-weight:900;
    line-height:1;
    background:linear-gradient(90deg,#7cc0ff 0%,#c88bff 50%,#ff9ec0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(180,120,255,.55));
    animation:titleLogoIn 1.1s cubic-bezier(.34,1.56,.64,1) both;
  }
  .title-play{
    position:relative;
    padding:18px 56px;
    border-radius:999px;
    border:0;
    background:linear-gradient(to bottom,#ffd66b,#f0a83a);
    color:#3a2400;
    font-family:inherit;
    font-weight:900;
    font-size:20px;
    letter-spacing:3px;
    cursor:pointer;
    box-shadow:
      0 6px 0 #a06f18,
      0 14px 30px rgba(255,180,60,.35),
      0 0 50px rgba(255,200,80,.4);
    animation:titlePlayIn 1.1s cubic-bezier(.34,1.56,.64,1) .35s both;
    transition:transform .08s ease, box-shadow .08s ease;
    outline:none;
  }
  .title-play:focus{outline:none}
  .title-play:active{
    transform:translateY(4px);
    box-shadow:
      0 2px 0 #a06f18,
      0 6px 12px rgba(0,0,0,.3),
      0 0 30px rgba(255,200,80,.4);
  }
  @media (max-width:400px){
    .title-logo{font-size:48px;letter-spacing:9px;padding-left:9px}
    .title-logo-wrap{width:250px;height:250px}
    .title-orbit{width:220px;height:220px;margin:-110px 0 0 -110px}
    .title-orbit-inner{width:160px;height:160px;margin:-80px 0 0 -80px}
    .title-play{padding:16px 46px;font-size:18px}
  }

  @keyframes titleGlow{
    0%,100%{ transform:scale(1); opacity:.9; }
    50%    { transform:scale(1.12); opacity:1; }
  }
  @keyframes titleOrbit{
    from{ transform:rotate(0deg); }
    to  { transform:rotate(360deg); }
  }
  @keyframes titleOrbitReverse{
    from{ transform:rotate(360deg); }
    to  { transform:rotate(0deg); }
  }
  @keyframes titleLogoIn{
    from{ opacity:0; transform:translateY(-40px) scale(.7); letter-spacing:30px; padding-left:30px; }
    to  { opacity:1; transform:translateY(0) scale(1); letter-spacing:12px; padding-left:12px; }
  }
  @keyframes titlePlayIn{
    from{ opacity:0; transform:translateY(30px) scale(.8); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }

  /* ============ ГАЙД ============ */
  #tutorial{
    position:fixed;inset:0;z-index:200;display:none;
    align-items:center;justify-content:center;
    padding:16px;
    background:rgba(6,4,20,.96);
  }
  #tutorial.on{display:flex}
  .tut-card{
    width:100%;
    max-width:400px;
    height:min(580px, 90vh);
    background:linear-gradient(180deg,#1c1240 0%,#0f0726 100%);
    border:1.5px solid rgba(140,110,220,.4);
    border-radius:24px;
    box-shadow:0 30px 100px rgba(120,60,220,.35);
    padding:20px 20px 18px;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .tut-header{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11px;letter-spacing:3px;text-transform:uppercase;
    color:#7a86a8;font-weight:800;
    flex:0 0 auto;
  }
  .tut-close{
    background:none;border:0;color:#7a86a8;
    font-size:20px;line-height:1;cursor:pointer;
    padding:4px 8px;font-family:inherit;
  }
  .tut-close:active{color:#fff}
  .tut-body{
    flex:1 1 auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:16px 4px;gap:14px;
    min-height:0;
    overflow-y:auto;
  }
  .tut-icon{
    font-size:64px;line-height:1;
    filter:drop-shadow(0 6px 18px rgba(180,120,255,.55));
    flex:0 0 auto;
  }
  .tut-title{
    font-size:24px;letter-spacing:2px;font-weight:900;color:#fff;
    margin:0;line-height:1.2;
    flex:0 0 auto;
  }
  .tut-text{
    font-size:15px;line-height:1.6;color:#b8c2dc;margin:0;
    max-width:320px;
  }
  .tut-text b{color:#fff;font-weight:800}
  .tut-text .gold{color:#ffd66b}
  .tut-text .purple{color:#d8b0ff}
  .tut-text .crimson{color:#ff8aa6}
  .tut-text .blue{color:#7cc0ff}
  .tut-dots{
    display:flex;justify-content:center;gap:8px;
    padding:12px 0 8px;
    flex:0 0 auto;
  }
  .tut-dot{
    width:8px;height:8px;border-radius:50%;
    background:#3a2a6a;
    transition:background .2s ease, transform .2s ease;
  }
  .tut-dot.active{
    background:#c88bff;transform:scale(1.35);
  }
  .tut-nav{display:flex;gap:10px;flex:0 0 auto}
  .tut-btn{
    flex:1 1 0;
    padding:14px 18px;
    border-radius:14px;border:0;
    font-family:inherit;
    font-weight:900;font-size:15px;letter-spacing:1px;
    cursor:pointer;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .tut-btn-prev{
    background:rgba(255,255,255,.06);
    color:#b8c2dc;
    border:1px solid rgba(255,255,255,.1);
  }
  .tut-btn-prev:disabled{opacity:.35;cursor:default}
  .tut-btn-prev:active:not(:disabled){transform:translateY(2px)}
  .tut-btn-next{
    background:linear-gradient(to bottom,#ffd66b,#f0a83a);
    color:#3a2400;
    box-shadow:0 4px 0 #a06f18;
  }
  .tut-btn-next:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #a06f18;
  }
</style>
</head>
<body class="loading">
<div id="app">
  <header>
    <div class="stat">Счёт<b id="score">0</b></div>
    <div class="stat right">
      Уровень<b id="level">1</b>
      <div id="planet">Меркурий</div>
      <div id="dirs"></div>
    </div>
  </header>
  <div id="middle">
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="overlay"></div>
      <div id="toast"></div>
    </div>
    <div id="previews"><span>Далее</span><div class="pv" id="pv0">·</div><div class="pv" id="pv1">·</div></div>
  </div>
  <div id="controls">
    <div class="grp">
      <button type="button" class="key" data-act="left">←</button>
      <button type="button" class="key" data-act="right">→</button>
    </div>
    <div class="grp">
      <button type="button" class="key" data-act="down">↓</button>
      <button type="button" class="key go" data-act="go">GO</button>
    </div>
  </div>
</div>

<div id="tutorial">
  <div class="tut-card">
    <div class="tut-header">
      <span id="tutStep">Шаг 1 из 4</span>
      <button class="tut-close" id="tutClose" type="button">✕</button>
    </div>
    <div class="tut-body">
      <div class="tut-icon" id="tutIcon">🎯</div>
      <h2 class="tut-title" id="tutTitle">Как играть</h2>
      <p class="tut-text" id="tutText"></p>
    </div>
    <div class="tut-dots" id="tutDots"></div>
    <div class="tut-nav">
      <button class="tut-btn tut-btn-prev" id="tutPrev" type="button">← Назад</button>
      <button class="tut-btn tut-btn-next" id="tutNext" type="button">Далее →</button>
    </div>
  </div>
</div>

<script src="dictionary.js"></script>
<script src="game.js"></script>
</body>
</html>
